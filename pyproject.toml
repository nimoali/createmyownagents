[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "createmyownagents"
version = "0.1.0"
description = "Starter framework for building custom agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "createmyownagents" }]

[project.scripts]
custom-agents = "custom_agents.cli:main"

[tool.setuptools.packages.find]
include = ["custom_agents*"]
